[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "charriot"
version = "0.1.0"
description = "Give two workloads the keys to a machine, on purpose."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Intentionally empty. Charriot uses the standard library and the kernel.
dependencies = []

[project.scripts]
charriot = "charriot.cli:main"

[tool.setuptools]
packages = ["charriot"]
